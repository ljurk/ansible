---
# BACKUP
# tar -I 'zstd -T0 -19' -cf "/data/backup/immich-$(date +%F).tar.zst" -C /data images
- hosts: hetzner2
  vars:
  roles:
    # - server.general.nftables
    - server.general.mount
    - server.general.podman
    - server.general.immich

  tasks:
    - name: Set Tailscale hostname
      ansible.builtin.command: tailscale set --hostname photo
      changed_when: false

    - name: Serve Immich over Tailscale HTTPS
      ansible.builtin.command: tailscale serve --bg --https=443 http://127.0.0.1:2283
      changed_when: false
