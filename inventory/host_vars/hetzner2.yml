---
###
# prometheus
###
prometheus__scrape_configs:
  - job_name: "prometheus"
    scrape_interval: 15s
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: "node"
    static_configs:
      - targets: ["10.89.0.1:9100"]
  - job_name: "blackbox"
    metrics_path: /probe
    params:
      module: [http_2xx] # Look for a HTTP 200 response.
    static_configs:
      - targets:
          - https://yzx.duckdns.org
          - https://files.yzx.duckdns.org
          - https://mon.yzx.duckdns.org
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115

###
# grafana
###
grafana__datasources:
  - name: prometheus
    type: prometheus
    uid: prometheus
    orgId: "1"
    url: "http://prometheus:9090"
    access: proxy

###
# traefik
###
traefik__routes:
  http:
    routers:
      httpToHttps:
        rule: "HostRegexp(`.*`)"
        service: api@internal
        entryPoints:
          - http
        middlewares:
          - toHttps
      immich:
        rule: "Host(`yzx.duckdns.org`)"
        service: immich
        entryPoints:
          - https
        tls:
          certResolver: letsencrypt
      files:
        rule: "Host(`files.yzx.duckdns.org`)"
        service: filebrowser
        entryPoints:
          - https
        tls:
          certResolver: letsencrypt
      mon:
        rule: "Host(`mon.yzx.duckdns.org`)"
        service: grafana
        entryPoints:
          - https
        tls:
          certResolver: letsencrypt

    services:
      immich:
        loadBalancer:
          servers:
            - url: "http://immich:2283"
      filebrowser:
        loadBalancer:
          servers:
            - url: "http://filebrowser"
      grafana:
        loadBalancer:
          servers:
            - url: "http://grafana:3000"
    middlewares:
      toHttps:
        redirectScheme:
          scheme: https
          permanent: true

